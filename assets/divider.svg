<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00C853" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6C63FF" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00C853" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .track { stroke: url(#dividerGrad); stroke-width: 1.4; fill: none; }
    .pulse {
      stroke: #ffffff;
      stroke-width: 1.4;
      fill: none;
      stroke-dasharray: 40 1200;
      opacity: 0.6;
      animation: travel 4.5s linear infinite;
    }
    @keyframes travel {
      from { stroke-dashoffset: 1200; }
      to   { stroke-dashoffset: -1200; }
    }
  </style>
  <line class="track" x1="0" y1="3" x2="1200" y2="3"/>
  <line class="pulse" x1="0" y1="3" x2="1200" y2="3"/>
</svg>
