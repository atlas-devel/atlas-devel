<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" role="img" aria-label="animated network diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .bg { fill: #0D1117; }
    .edge {
      fill: none;
      stroke: url(#lineGrad);
      stroke-width: 1.4;
      stroke-linecap: round;
      opacity: 0.55;
      stroke-dasharray: 6 10;
      animation: flow 3.6s linear infinite;
    }
    .edge.slow { animation-duration: 5.2s; opacity: 0.4; }
    .edge.fast { animation-duration: 2.4s; opacity: 0.65; }
    @keyframes flow {
      to { stroke-dashoffset: -160; }
    }
    .node {
      fill: url(#nodeGrad);
      transform-origin: center;
      transform-box: fill-box;
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.75; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .core { fill: #ffffff; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="240"/>

  <!-- edges -->
  <g>
    <path class="edge"       d="M80,120 L220,55"/>
    <path class="edge slow"  d="M80,120 L220,185"/>
    <path class="edge fast"  d="M220,55 L370,120"/>
    <path class="edge"       d="M220,185 L370,120"/>
    <path class="edge slow"  d="M370,120 L520,45"/>
    <path class="edge fast"  d="M370,120 L520,195"/>
    <path class="edge"       d="M520,45 L660,120"/>
    <path class="edge slow"  d="M520,195 L660,120"/>
    <path class="edge fast"  d="M660,120 L800,55"/>
    <path class="edge"       d="M660,120 L800,185"/>
    <path class="edge slow"  d="M800,55 L940,120"/>
    <path class="edge fast"  d="M800,185 L940,120"/>
    <path class="edge"       d="M940,120 L1080,65"/>
    <path class="edge slow"  d="M940,120 L1080,175"/>
    <path class="edge fast"  d="M1080,65 L1140,120"/>
    <path class="edge"       d="M1080,175 L1140,120"/>
  </g>

  <!-- nodes -->
  <g>
    <circle class="node" cx="80"   cy="120" r="7"/>
    <circle class="node" cx="220"  cy="55"  r="5"/>
    <circle class="node" cx="220"  cy="185" r="5"/>
    <circle class="node" cx="370"  cy="120" r="6"/>
    <circle class="node" cx="520"  cy="45"  r="5"/>
    <circle class="node" cx="520"  cy="195" r="5"/>
    <circle class="node" cx="660"  cy="120" r="7"/>
    <circle class="node" cx="800"  cy="55"  r="5"/>
    <circle class="node" cx="800"  cy="185" r="5"/>
    <circle class="node" cx="940"  cy="120" r="6"/>
    <circle class="node" cx="1080" cy="65"  r="5"/>
    <circle class="node" cx="1080" cy="175" r="5"/>
    <circle class="node" cx="1140" cy="120" r="7"/>
  </g>

  <!-- small solid centers so nodes read clearly at rest -->
  <g fill="#0D1117">
    <circle class="core" cx="80"   cy="120" r="2"/>
    <circle class="core" cx="370"  cy="120" r="2"/>
    <circle class="core" cx="660"  cy="120" r="2"/>
    <circle class="core" cx="940"  cy="120" r="2"/>
    <circle class="core" cx="1140" cy="120" r="2"/>
  </g>
</svg>
